{% extends "base.html" %}

{% block title %}Register | A Good Life{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/register_style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
{% endblock %}

{% block content %}
<main>
    <h1>Registration</h1>
    <p class="error">{{ msg }}</p>
    <p class="msg">{{ smsg }}</p>
    
    <form action="/register" method="POST">
        <label for="name">Name</label><br>
        <input type="text" name="name" id="name"><br>
        
        <label for="mail">Email</label><br>
        <input type="email" name="mail" id="mail"><br>
        
        <label for="profession">Profession</label><br>
        <select name="profession" id="profession">
            <option value="student">Student</option>
            <option value="actor">Actor</option>
            <option value="director">Director</option>
            <option value="audience">Audience</option>
            <option value="others">Others</option>
        </select><br>
        
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password"><br>
        
        <label for="cpassword">Confirm Password</label><br>
        <input type="password" name="cpassword" id="cpassword"><br>
        
        <p>Already Registered? <a href="/login">Log In</a></p><br>
        
        <button type="submit">Sign Up</button>
        <button type="reset">Clear</button>
    </form>
</main>

<!-- ACCESSIBILITY OPTIONS -->
<section class="accessibility">
    <ul id="list">
        <li><a href="#" id="lightMode">Light Mode</a></li>
        <li><a href="#" id="darkMode">Dark Mode</a></li>
        <li><a href="#top">Back to top</a></li>
    </ul>
    <button type="submit" id="btn"><i style="font-size:32px" class="fa fa-universal-access"></i></button>
</section>
{% endblock %}
